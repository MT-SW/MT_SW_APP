name: Build Binaries (Manual)

# Ręczne budowanie binarek przez Actions — Actions > "Build Binaries (Manual)" > Run workflow.
# Zaznacz tylko te pliki, które chcesz zbudować (każdy system i format osobno).
on:
  workflow_dispatch:
    inputs:
      build_android:
        description: 'Android: APK (flavor fdroid)'
        type: boolean
        default: false
      windows_msi:
        description: 'Windows: instalator .msi'
        type: boolean
        default: false
      windows_exe:
        description: 'Windows: instalator .exe'
        type: boolean
        default: false
      windows_jar:
        description: 'Windows: plik .jar (uber jar)'
        type: boolean
        default: false
      linux_deb:
        description: 'Linux: pakiet .deb'
        type: boolean
        default: false
      linux_rpm:
        description: 'Linux: pakiet .rpm'
        type: boolean
        default: false
      linux_appimage:
        description: 'Linux: plik .AppImage'
        type: boolean
        default: false
      linux_jar:
        description: 'Linux: plik .jar (uber jar)'
        type: boolean
        default: false
      macos_dmg:
        description: 'macOS: obraz .dmg'
        type: boolean
        default: false
      macos_jar:
        description: 'macOS: plik .jar (uber jar)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: build-binaries-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    if: ${{ inputs.build_android }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # GitHub Actions nie pozwala odwoływać się do `secrets` bezpośrednio w warunku `if:` --
    # trzeba je najpierw przepuścić przez `env:` na poziomie joba, i sprawdzać `env.*` w `if:`.
    env:
      KEYSTORE: ${{ secrets.KEYSTORE }}
      KEYSTORE_FILENAME: ${{ secrets.KEYSTORE_FILENAME }}
      KEYSTORE_PROPERTIES: ${{ secrets.KEYSTORE_PROPERTIES }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - uses: ./.github/actions/gradle-setup

      - name: Build fdroid debug APK
        run: ./gradlew :androidApp:assembleFdroidDebug

      # Odpalane tylko jeśli w repo są ustawione sekrety KEYSTORE / KEYSTORE_FILENAME /
      # KEYSTORE_PROPERTIES (Settings > Secrets and variables > Actions) -- bez nich
      # ten krok jest po prostu pominięty i build kończy się na APK debug.
      - name: Decode signing keystore
        if: ${{ env.KEYSTORE != '' }}
        run: |
          echo "$KEYSTORE" | base64 -di > "./androidApp/$KEYSTORE_FILENAME"
          echo "$KEYSTORE_PROPERTIES" > ./keystore.properties

      - name: Build fdroid release APK
        if: ${{ env.KEYSTORE != '' }}
        run: ./gradlew :androidApp:assembleFdroidRelease

      - uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: |
            androidApp/build/outputs/apk/fdroid/debug/*.apk
            androidApp/build/outputs/apk/fdroid/release/*.apk
          if-no-files-found: ignore
          retention-days: 30


  desktop-windows:
    if: ${{ inputs.windows_msi || inputs.windows_exe || inputs.windows_jar }}
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - uses: ./.github/actions/gradle-setup
        with:
          install_jetbrains_jdk: 'true'

      - name: Build selected packages
        shell: bash
        env:
          B_WINDOWS_MSI: ${{ inputs.windows_msi }}
          B_WINDOWS_EXE: ${{ inputs.windows_exe }}
          B_WINDOWS_JAR: ${{ inputs.windows_jar }}
        run: |
          TASKS=""
          [ "$B_WINDOWS_MSI" = "true" ] && TASKS="$TASKS :desktopApp:packageMsi"
          [ "$B_WINDOWS_EXE" = "true" ] && TASKS="$TASKS :desktopApp:packageExe"
          [ "$B_WINDOWS_JAR" = "true" ] && TASKS="$TASKS :desktopApp:packageUberJarForCurrentOS"
          echo "Gradle tasks:$TASKS"
          # Windows: pakowanie MSI/EXE (WiX) czyta Project.layout projektu głównego, czego
          # Isolated Projects nie dopuszcza -- obie flagi muszą iść razem (tak samo jak w release.yml).
          ./gradlew $TASKS --no-isolated-projects --no-configuration-cache

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-windows
          path: |
            desktopApp/build/compose/binaries/main/msi/*.msi
            desktopApp/build/compose/binaries/main/exe/*.exe
            desktopApp/build/compose/jars/*.jar
          if-no-files-found: ignore
          retention-days: 30

  desktop-linux:
    if: ${{ inputs.linux_deb || inputs.linux_rpm || inputs.linux_appimage || inputs.linux_jar }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - uses: ./.github/actions/gradle-setup
        with:
          install_jetbrains_jdk: 'true'

      # AppImage potrzebuje biblioteki FUSE na Linuksie.
      - name: Install AppImage runtime dependency
        if: ${{ inputs.linux_appimage }}
        run: sudo apt-get update && sudo apt-get install -y libfuse2t64

      - name: Build selected packages
        shell: bash
        env:
          B_LINUX_DEB: ${{ inputs.linux_deb }}
          B_LINUX_RPM: ${{ inputs.linux_rpm }}
          B_LINUX_APPIMAGE: ${{ inputs.linux_appimage }}
          B_LINUX_JAR: ${{ inputs.linux_jar }}
        run: |
          TASKS=""
          [ "$B_LINUX_DEB" = "true" ] && TASKS="$TASKS :desktopApp:packageDeb"
          [ "$B_LINUX_RPM" = "true" ] && TASKS="$TASKS :desktopApp:packageRpm"
          [ "$B_LINUX_APPIMAGE" = "true" ] && TASKS="$TASKS :desktopApp:packageAppImage"
          [ "$B_LINUX_JAR" = "true" ] && TASKS="$TASKS :desktopApp:packageUberJarForCurrentOS"
          echo "Gradle tasks:$TASKS"
          ./gradlew $TASKS

      # Zamiana jpackage'owego "app-image" (goły katalog) w prawdziwy, jednoplikowy .AppImage.
      - name: Build real .AppImage
        if: ${{ inputs.linux_appimage }}
        env:
          APP_VERSION_NAME: dev-${{ github.run_number }}
          BINARIES_DIR: desktopApp/build/compose/binaries/main
        run: scripts/build-appimage.sh

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-linux
          path: |
            desktopApp/build/compose/binaries/main/deb/*.deb
            desktopApp/build/compose/binaries/main/rpm/*.rpm
            desktopApp/build/compose/binaries/main/appimage/*.AppImage
            desktopApp/build/compose/jars/*.jar
          if-no-files-found: ignore
          retention-days: 30

  desktop-macos:
    if: ${{ inputs.macos_dmg || inputs.macos_jar }}
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - uses: ./.github/actions/gradle-setup
        with:
          install_jetbrains_jdk: 'true'

      - name: Build selected packages
        shell: bash
        env:
          B_MACOS_DMG: ${{ inputs.macos_dmg }}
          B_MACOS_JAR: ${{ inputs.macos_jar }}
        run: |
          TASKS=""
          [ "$B_MACOS_DMG" = "true" ] && TASKS="$TASKS :desktopApp:packageDmg"
          [ "$B_MACOS_JAR" = "true" ] && TASKS="$TASKS :desktopApp:packageUberJarForCurrentOS"
          echo "Gradle tasks:$TASKS"
          ./gradlew $TASKS

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-macos
          path: |
            desktopApp/build/compose/binaries/main/dmg/*.dmg
            desktopApp/build/compose/jars/*.jar
          if-no-files-found: ignore
          retention-days: 30

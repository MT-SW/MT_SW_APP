name: Build Binaries (Manual)

# Ręczne budowanie binarek przez Actions — Ty > Actions > "Build Binaries (Manual)" > Run workflow.
on:
  workflow_dispatch:
    inputs:
      build_android:
        description: 'Zbuduj APK (Android, flavor fdroid)'
        type: boolean
        default: true
      build_desktop:
        description: 'Zbuduj instalatory desktopowe (Windows/macOS/Linux)'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: build-binaries-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    if: ${{ inputs.build_android }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # GitHub Actions nie pozwala odwoływać się do `secrets` bezpośrednio w warunku `if:` --
    # trzeba je najpierw przepuścić przez `env:` na poziomie joba, i sprawdzać `env.*` w `if:`.
    env:
      KEYSTORE: ${{ secrets.KEYSTORE }}
      KEYSTORE_FILENAME: ${{ secrets.KEYSTORE_FILENAME }}
      KEYSTORE_PROPERTIES: ${{ secrets.KEYSTORE_PROPERTIES }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - uses: ./.github/actions/gradle-setup

      - name: Build fdroid debug APK
        run: ./gradlew :androidApp:assembleFdroidDebug

      # Odpalane tylko jeśli w repo są ustawione sekrety KEYSTORE / KEYSTORE_FILENAME /
      # KEYSTORE_PROPERTIES (Settings > Secrets and variables > Actions) -- bez nich
      # ten krok jest po prostu pominięty i build kończy się na APK debug.
      - name: Decode signing keystore
        if: ${{ env.KEYSTORE != '' }}
        run: |
          echo "$KEYSTORE" | base64 -di > "./androidApp/$KEYSTORE_FILENAME"
          echo "$KEYSTORE_PROPERTIES" > ./keystore.properties

      - name: Build fdroid release APK
        if: ${{ env.KEYSTORE != '' }}
        run: ./gradlew :androidApp:assembleFdroidRelease

      - uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: |
            androidApp/build/outputs/apk/fdroid/debug/*.apk
            androidApp/build/outputs/apk/fdroid/release/*.apk
          if-no-files-found: ignore
          retention-days: 30

  desktop:
    if: ${{ inputs.build_desktop }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - uses: ./.github/actions/gradle-setup
        with:
          install_jetbrains_jdk: 'true'

      - name: Build desktop distributable for this OS
        run: ./gradlew :desktopApp:packageDistributionForCurrentOS

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: |
            desktopApp/build/compose/binaries/**/*.msi
            desktopApp/build/compose/binaries/**/*.exe
            desktopApp/build/compose/binaries/**/*.dmg
            desktopApp/build/compose/binaries/**/*.deb
            desktopApp/build/compose/binaries/**/*.rpm
            desktopApp/build/compose/binaries/**/*.AppImage
          if-no-files-found: ignore
          retention-days: 30

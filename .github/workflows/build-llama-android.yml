# Builds the llama.cpp server for Android phones in two variants and puts them on this project's release page, where
# the app fetches them: "opencl" (Snapdragon / Adreno graphics) and "vulkan" (any phone with a Vulkan driver).
# The app tries them in that order and falls back to the processor build. Run by hand: Actions -> Run workflow.
name: Build llama.cpp and whisper.cpp for Android

on:
  # Only by hand: Actions -> Run workflow. It never starts by itself.
  workflow_dispatch:
    inputs:
      llama_tag:
        description: "llama.cpp tag (must match LLAMA_TAG in ModelServerInstaller)"
        default: "b11960"
        required: true
      whisper_ref:
        description: "whisper.cpp version (must match WHISPER_REF in ModelServerInstaller)"
        default: "v1.9.5"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: Make sure the release exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="engines-${{ inputs.llama_tag || 'b11960' }}"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "AI engines ${{ inputs.llama_tag || 'b11960' }}" \
              --notes "Programs the app downloads for its AI models. Do not delete." --prerelease

  build:
    needs: release
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        kind: [opencl, vulkan]
    steps:
      - name: Get llama.cpp
        run: git clone --depth 1 --branch "${{ inputs.llama_tag || 'b11960' }}" https://github.com/ggml-org/llama.cpp llama.cpp

      - name: Tools
        run: |
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          echo "NDK=$NDK" >> "$GITHUB_ENV"
          echo "SYSROOT=$NDK/toolchains/llvm/prebuilt/linux-x86_64/sysroot" >> "$GITHUB_ENV"
          sudo apt-get update
          sudo apt-get install -y ninja-build glslc glslang-tools libvulkan-dev

      - name: OpenCL headers and loader (only to link)
        if: matrix.kind == 'opencl'
        run: |
          git clone --depth 1 https://github.com/KhronosGroup/OpenCL-Headers
          cp -r OpenCL-Headers/CL "$SYSROOT/usr/include"
          git clone --depth 1 https://github.com/KhronosGroup/OpenCL-ICD-Loader
          cmake -S OpenCL-ICD-Loader -B icd-build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DOPENCL_ICD_LOADER_HEADERS_DIR="$SYSROOT/usr/include" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=24 -DANDROID_STL=c++_shared
          cmake --build icd-build
          cp icd-build/libOpenCL.so "$SYSROOT/usr/lib/aarch64-linux-android"

      - name: Vulkan and SPIR-V headers (the Android kit has no vulkan.hpp)
        if: matrix.kind == 'vulkan'
        run: |
          git clone --depth 1 https://github.com/KhronosGroup/Vulkan-Headers
          echo "VULKAN_HEADERS=$PWD/Vulkan-Headers/include" >> "$GITHUB_ENV"
          git clone --depth 1 https://github.com/KhronosGroup/SPIRV-Headers
          cmake -S SPIRV-Headers -B spirv-build -G Ninja -DCMAKE_INSTALL_PREFIX="$PWD/spirv-install"
          cmake --install spirv-build
          echo "SPIRV_PREFIX=$PWD/spirv-install" >> "$GITHUB_ENV"
          # Also next to the Vulkan headers, which the compiler already searches.
          cp -r "$PWD/spirv-install/include/spirv" "$PWD/Vulkan-Headers/include/"
          ls "$PWD/Vulkan-Headers/include/spirv/unified1/spirv.hpp"

      - name: Build llama-server
        run: |
          EXTRA_CXX=""
          if [ "${{ matrix.kind }}" = "opencl" ]; then
            BACKEND="-DGGML_OPENCL=ON -DGGML_OPENCL_USE_ADRENO_KERNELS=ON"
          else
            EXTRA_CXX="-isystem $SPIRV_PREFIX/include"
            BACKEND="-DGGML_VULKAN=ON -DVulkan_GLSLC_EXECUTABLE=$(which glslc) -DVulkan_INCLUDE_DIR=$VULKAN_HEADERS -DVulkan_LIBRARY=$SYSROOT/usr/lib/aarch64-linux-android/28/libvulkan.so -DCMAKE_FIND_ROOT_PATH=$SPIRV_PREFIX -DCMAKE_PREFIX_PATH=$SPIRV_PREFIX -DSPIRV-Headers_DIR=$SPIRV_PREFIX/share/cmake/SPIRV-Headers"
          fi
          cmake -S llama.cpp -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-28 -DANDROID_STL=c++_static \
            -DBUILD_SHARED_LIBS=OFF $BACKEND \
            -DGGML_NATIVE=OFF -DGGML_OPENMP=OFF \
            -DCMAKE_C_FLAGS="-march=armv8.2-a+dotprod" -DCMAKE_CXX_FLAGS="-march=armv8.2-a+dotprod $EXTRA_CXX" \
            -DLLAMA_CURL=OFF -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_EXAMPLES=OFF
          cmake --build build --target llama-server

      - name: Pack
        run: |
          mkdir pack
          cp build/bin/llama-server pack/
          cp llama.cpp/LICENSE pack/
          tar -czf "llama-${{ inputs.llama_tag || 'b11960' }}-android-arm64-${{ matrix.kind }}.tar.gz" -C pack .
          ls -l *.tar.gz

      - name: Publish on the release page
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "engines-${{ inputs.llama_tag || 'b11960' }}" --repo "$GITHUB_REPOSITORY" --clobber llama-*-android-arm64-${{ matrix.kind }}.tar.gz

  whisper:
    needs: release
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # i8mm: the processor build for newer phones (faster with Q8 models); cpu: the plain build for every phone.
        kind: [cpu, i8mm, opencl, openclgen, vulkan]
    steps:
      - name: Get whisper.cpp
        run: git clone --depth 1 --branch "${{ inputs.whisper_ref || 'v1.9.5' }}" https://github.com/ggml-org/whisper.cpp whisper.cpp

      - name: Tools
        run: |
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          echo "NDK=$NDK" >> "$GITHUB_ENV"
          echo "SYSROOT=$NDK/toolchains/llvm/prebuilt/linux-x86_64/sysroot" >> "$GITHUB_ENV"
          sudo apt-get update
          sudo apt-get install -y ninja-build glslc glslang-tools libvulkan-dev

      - name: OpenCL headers and loader (only to link)
        if: startsWith(matrix.kind, 'opencl')
        run: |
          git clone --depth 1 https://github.com/KhronosGroup/OpenCL-Headers
          cp -r OpenCL-Headers/CL "$SYSROOT/usr/include"
          git clone --depth 1 https://github.com/KhronosGroup/OpenCL-ICD-Loader
          cmake -S OpenCL-ICD-Loader -B icd-build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DOPENCL_ICD_LOADER_HEADERS_DIR="$SYSROOT/usr/include" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=24 -DANDROID_STL=c++_shared
          cmake --build icd-build
          cp icd-build/libOpenCL.so "$SYSROOT/usr/lib/aarch64-linux-android"

      - name: Vulkan and SPIR-V headers (the Android kit has no vulkan.hpp)
        if: matrix.kind == 'vulkan'
        run: |
          git clone --depth 1 https://github.com/KhronosGroup/Vulkan-Headers
          echo "VULKAN_HEADERS=$PWD/Vulkan-Headers/include" >> "$GITHUB_ENV"
          git clone --depth 1 https://github.com/KhronosGroup/SPIRV-Headers
          cmake -S SPIRV-Headers -B spirv-build -G Ninja -DCMAKE_INSTALL_PREFIX="$PWD/spirv-install"
          cmake --install spirv-build
          echo "SPIRV_PREFIX=$PWD/spirv-install" >> "$GITHUB_ENV"
          cp -r "$PWD/spirv-install/include/spirv" "$PWD/Vulkan-Headers/include/"

      - name: Build whisper-server
        run: |
          EXTRA_CXX=""
          BACKEND=""
          if [ "${{ matrix.kind }}" = "opencl" ]; then
            BACKEND="-DGGML_OPENCL=ON -DGGML_OPENCL_USE_ADRENO_KERNELS=ON"
          elif [ "${{ matrix.kind }}" = "openclgen" ]; then
            BACKEND="-DGGML_OPENCL=ON -DGGML_OPENCL_USE_ADRENO_KERNELS=OFF"
          elif [ "${{ matrix.kind }}" = "vulkan" ]; then
            EXTRA_CXX="-isystem $SPIRV_PREFIX/include"
            BACKEND="-DGGML_VULKAN=ON -DVulkan_GLSLC_EXECUTABLE=$(which glslc) -DVulkan_INCLUDE_DIR=$VULKAN_HEADERS -DVulkan_LIBRARY=$SYSROOT/usr/lib/aarch64-linux-android/28/libvulkan.so -DCMAKE_FIND_ROOT_PATH=$SPIRV_PREFIX -DCMAKE_PREFIX_PATH=$SPIRV_PREFIX -DSPIRV-Headers_DIR=$SPIRV_PREFIX/share/cmake/SPIRV-Headers"
          fi
          ARCH="armv8.2-a+dotprod"
          if [ "${{ matrix.kind }}" = "i8mm" ]; then ARCH="armv8.6-a+fp16+dotprod+i8mm"; fi
          cmake -S whisper.cpp -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-28 -DANDROID_STL=c++_static \
            -DBUILD_SHARED_LIBS=OFF $BACKEND -DGGML_NATIVE=OFF -DGGML_OPENMP=OFF \
            -DCMAKE_C_FLAGS="-march=$ARCH" -DCMAKE_CXX_FLAGS="-march=$ARCH $EXTRA_CXX" \
            -DWHISPER_BUILD_TESTS=OFF -DWHISPER_SDL2=OFF -DWHISPER_BUILD_EXAMPLES=ON
          cmake --build build --target whisper-server

      - name: Pack
        run: |
          BIN="$(find build -name whisper-server -type f | head -n 1)"
          # A chip build must really contain its backend; otherwise it would be a processor build under a false name.
          if [ "${{ matrix.kind }}" = "opencl" ] || [ "${{ matrix.kind }}" = "openclgen" ]; then strings "$BIN" | grep -qi "ggml_opencl" ; fi
          if [ "${{ matrix.kind }}" = "vulkan" ]; then strings "$BIN" | grep -qi "ggml_vulkan" ; fi
          mkdir pack
          cp "$BIN" pack/
          cp whisper.cpp/LICENSE pack/
          NAME="whisper-${{ inputs.whisper_ref || 'v1.9.5' }}-android-arm64"
          if [ "${{ matrix.kind }}" != "cpu" ]; then NAME="$NAME-${{ matrix.kind }}"; fi
          tar -czf "$NAME.tar.gz" -C pack .
          ls -l *.tar.gz

      - name: Publish on the release page
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "engines-${{ inputs.llama_tag || 'b11960' }}" --repo "$GITHUB_REPOSITORY" --clobber whisper-*-android-arm64*.tar.gz

  # The Hexagon NPU of Snapdragon phones. Built in Qualcomm's own toolchain image (it holds the Hexagon SDK), with
  # shared libraries: the NPU programs (libggml-htp-v73/v75/v79/v81.so) are loaded by the NPU backend at run time.
  whisper-npu:
    needs: release
    runs-on: ubuntu-24.04
    steps:
      - name: Get whisper.cpp
        run: git clone --depth 1 --branch "${{ inputs.whisper_ref || 'v1.9.5' }}" https://github.com/ggml-org/whisper.cpp whisper.cpp

      - name: Keep the model caches on the processor (the NPU cannot copy into its own memory)
        run: |
          # whisper.cpp puts the attention caches in the memory of the first (graphics/NPU) backend; the Hexagon backend
          # cannot run the copy operation there and the program aborts. The last backend is the processor.
          sed -i -E 's/(whisper_kv_cache_init\(state->kv_[a-z_]+, )state->backends\[0\]/\1state->backends.back()/' whisper.cpp/src/whisper.cpp
          test "$(grep -c 'whisper_kv_cache_init(state->kv_[a-z_]*, state->backends.back()' whisper.cpp/src/whisper.cpp)" -ge 3
          grep -n 'whisper_kv_cache_init(' whisper.cpp/src/whisper.cpp

      - name: Build whisper-server with the Hexagon backend
        run: |
          docker run --rm --platform linux/amd64 -v "$PWD":/workspace -w /workspace ghcr.io/snapdragon-toolchain/arm64-android:v0.7 bash -c '
            set -e
            # Not a login shell: that would reset the image'"'"'s PATH and environment (Ninja, NDK, Hexagon SDK).
            env | grep -i -E "ndk|hexagon|android|^PATH" || true
            NDK="${ANDROID_NDK_ROOT:-${ANDROID_NDK:-$(ls -d /opt/android-ndk* 2>/dev/null | head -n 1)}}"
            if [ ! -f "$NDK/build/cmake/android.toolchain.cmake" ]; then
              NDK="$(dirname "$(dirname "$(dirname "$(find / -name android.toolchain.cmake -path "*build/cmake*" 2>/dev/null | head -n 1)")")")"
            fi
            HEX="${HEXAGON_SDK_ROOT:-$(ls -d /opt/hexagon/* 2>/dev/null | head -n 1)}"
            echo "NDK=$NDK HEXAGON=$HEX"
            GEN="-G Ninja"; command -v ninja >/dev/null 2>&1 || GEN=""
            cmake -S whisper.cpp -B build-npu $GEN -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
              -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-31 \
              -DGGML_HEXAGON=ON -DHEXAGON_SDK_ROOT="$HEX" -DHEXAGON_TOOLS_ROOT="${HEXAGON_TOOLS_ROOT:-}" \
              -DPREBUILT_LIB_DIR=android_aarch64 \
              -DGGML_OPENMP=OFF -DGGML_NATIVE=OFF \
              -DCMAKE_C_FLAGS="-march=armv8.7a+fp16+dotprod+i8mm -D_GNU_SOURCE" -DCMAKE_CXX_FLAGS="-march=armv8.7a+fp16+dotprod+i8mm -D_GNU_SOURCE" \
              -DWHISPER_BUILD_TESTS=OFF -DWHISPER_SDL2=OFF -DWHISPER_BUILD_EXAMPLES=ON
            # Everything is built (not only the server): the install step below needs all of it.
            cmake --build build-npu -j
            # The NPU programs (libggml-htp-v*.so) are put in place by the install step.
            cmake --install build-npu --prefix /workspace/install-npu
          '

      - name: Pack
        run: |
          mkdir -p pack/bin pack/lib
          cp "$(find build-npu -name whisper-server -type f | head -n 1)" pack/bin/
          find build-npu install-npu -name '*.so' -type f -exec cp {} pack/lib/ \;
          find build-npu install-npu -name 'libggml-htp*' | head
          ls pack/lib
          ls pack/lib | grep -q "libggml-hexagon.so"
          ls pack/lib | grep -q "libggml-htp-v"
          cp whisper.cpp/LICENSE pack/
          tar -czf "whisper-${{ inputs.whisper_ref || 'v1.9.5' }}-android-arm64-snapdragon.tar.gz" -C pack .
          ls -l *.tar.gz

      - name: Publish on the release page
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "engines-${{ inputs.llama_tag || 'b11960' }}" --repo "$GITHUB_REPOSITORY" --clobber whisper-*-android-arm64-snapdragon.tar.gz

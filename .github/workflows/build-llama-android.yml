# Builds the llama.cpp server for Android phones in two variants and puts them on this project's release page, where
# the app fetches them: "opencl" (Snapdragon / Adreno graphics) and "vulkan" (any phone with a Vulkan driver).
# The app tries them in that order and falls back to the processor build. Run by hand: Actions -> Run workflow.
name: Build llama.cpp and whisper.cpp for Android

on:
  # Runs by itself when this file is pushed to GitHub (so nothing has to be clicked), and by hand when needed.
  push:
    paths:
      - ".github/workflows/build-llama-android.yml"
  workflow_dispatch:
    inputs:
      llama_tag:
        description: "llama.cpp tag (must match LLAMA_TAG in ModelServerInstaller)"
        default: "b11960"
        required: true
      whisper_ref:
        description: "whisper.cpp version (must match WHISPER_REF in ModelServerInstaller)"
        default: "v1.9.5"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: Make sure the release exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="engines-${{ inputs.llama_tag || 'b11960' }}"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "AI engines ${{ inputs.llama_tag || 'b11960' }}" \
              --notes "Programs the app downloads for its AI models. Do not delete." --prerelease

  build:
    needs: release
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        kind: [opencl, vulkan]
    steps:
      - name: Get llama.cpp
        run: git clone --depth 1 --branch "${{ inputs.llama_tag || 'b11960' }}" https://github.com/ggml-org/llama.cpp llama.cpp

      - name: Tools
        run: |
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          echo "NDK=$NDK" >> "$GITHUB_ENV"
          echo "SYSROOT=$NDK/toolchains/llvm/prebuilt/linux-x86_64/sysroot" >> "$GITHUB_ENV"
          sudo apt-get update
          sudo apt-get install -y ninja-build glslc glslang-tools libvulkan-dev

      - name: OpenCL headers and loader (only to link)
        if: matrix.kind == 'opencl'
        run: |
          git clone --depth 1 https://github.com/KhronosGroup/OpenCL-Headers
          cp -r OpenCL-Headers/CL "$SYSROOT/usr/include"
          git clone --depth 1 https://github.com/KhronosGroup/OpenCL-ICD-Loader
          cmake -S OpenCL-ICD-Loader -B icd-build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DOPENCL_ICD_LOADER_HEADERS_DIR="$SYSROOT/usr/include" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=24 -DANDROID_STL=c++_shared
          cmake --build icd-build
          cp icd-build/libOpenCL.so "$SYSROOT/usr/lib/aarch64-linux-android"

      - name: Vulkan and SPIR-V headers (the Android kit has no vulkan.hpp)
        if: matrix.kind == 'vulkan'
        run: |
          git clone --depth 1 https://github.com/KhronosGroup/Vulkan-Headers
          echo "VULKAN_HEADERS=$PWD/Vulkan-Headers/include" >> "$GITHUB_ENV"
          git clone --depth 1 https://github.com/KhronosGroup/SPIRV-Headers
          cmake -S SPIRV-Headers -B spirv-build -G Ninja -DCMAKE_INSTALL_PREFIX="$PWD/spirv-install"
          cmake --install spirv-build
          echo "SPIRV_PREFIX=$PWD/spirv-install" >> "$GITHUB_ENV"

      - name: Build llama-server
        run: |
          EXTRA_CXX=""
          if [ "${{ matrix.kind }}" = "opencl" ]; then
            BACKEND="-DGGML_OPENCL=ON -DGGML_OPENCL_USE_ADRENO_KERNELS=ON"
          else
            EXTRA_CXX="-isystem $SPIRV_PREFIX/include"
            BACKEND="-DGGML_VULKAN=ON -DVulkan_GLSLC_EXECUTABLE=$(which glslc) -DVulkan_INCLUDE_DIR=$VULKAN_HEADERS -DVulkan_LIBRARY=$SYSROOT/usr/lib/aarch64-linux-android/28/libvulkan.so -DCMAKE_FIND_ROOT_PATH=$SPIRV_PREFIX -DCMAKE_PREFIX_PATH=$SPIRV_PREFIX -DSPIRV-Headers_DIR=$SPIRV_PREFIX/share/cmake/SPIRV-Headers"
          fi
          cmake -S llama.cpp -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-28 -DANDROID_STL=c++_static \
            -DBUILD_SHARED_LIBS=OFF $BACKEND \
            -DGGML_NATIVE=OFF -DGGML_OPENMP=OFF \
            -DCMAKE_C_FLAGS="-march=armv8.2-a+dotprod" -DCMAKE_CXX_FLAGS="-march=armv8.2-a+dotprod $EXTRA_CXX" \
            -DLLAMA_CURL=OFF -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_EXAMPLES=OFF
          cmake --build build --target llama-server

      - name: Pack
        run: |
          mkdir pack
          cp build/bin/llama-server pack/
          cp llama.cpp/LICENSE pack/
          tar -czf "llama-${{ inputs.llama_tag || 'b11960' }}-android-arm64-${{ matrix.kind }}.tar.gz" -C pack .
          ls -l *.tar.gz

      - name: Publish on the release page
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "engines-${{ inputs.llama_tag || 'b11960' }}" --repo "$GITHUB_REPOSITORY" --clobber llama-*-android-arm64-${{ matrix.kind }}.tar.gz

  whisper:
    needs: release
    runs-on: ubuntu-24.04
    steps:
      - name: Get whisper.cpp
        run: git clone --depth 1 --branch "${{ inputs.whisper_ref || 'v1.9.5' }}" https://github.com/ggml-org/whisper.cpp whisper.cpp

      - name: Tools
        run: |
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          echo "NDK=$NDK" >> "$GITHUB_ENV"
          sudo apt-get update
          sudo apt-get install -y ninja-build

      - name: Build whisper-server (processor only)
        run: |
          cmake -S whisper.cpp -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-28 -DANDROID_STL=c++_static \
            -DBUILD_SHARED_LIBS=OFF -DGGML_NATIVE=OFF -DGGML_OPENMP=OFF \
            -DCMAKE_C_FLAGS="-march=armv8.2-a+dotprod" -DCMAKE_CXX_FLAGS="-march=armv8.2-a+dotprod" \
            -DWHISPER_BUILD_TESTS=OFF -DWHISPER_SDL2=OFF -DWHISPER_BUILD_EXAMPLES=ON
          cmake --build build --target whisper-server

      - name: Pack
        run: |
          mkdir pack
          cp "$(find build -name whisper-server -type f | head -n 1)" pack/
          cp whisper.cpp/LICENSE pack/
          tar -czf "whisper-${{ inputs.whisper_ref || 'v1.9.5' }}-android-arm64.tar.gz" -C pack .
          ls -l *.tar.gz

      - name: Publish on the release page
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "engines-${{ inputs.llama_tag || 'b11960' }}" --repo "$GITHUB_REPOSITORY" --clobber whisper-*-android-arm64.tar.gz

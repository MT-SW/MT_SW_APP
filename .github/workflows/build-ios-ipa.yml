# Builds the unsigned iPhone/iPad app file (.ipa) on a GitHub Mac. One file works on both iPhone and iPad.
# AltStore or Sideloadly signs it with the installer's own Apple ID.
# Run by hand: Actions -> Run workflow. It never starts by itself.
name: Build iOS app (iPhone and iPad)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Tools
        run: brew install xcodegen cmake

      - name: Build the AI engines for iOS
        run: ./scripts/build-llama-ios.sh

      - name: Build the unsigned .ipa
        run: ./scripts/build-ios-ipa.sh

      - uses: actions/upload-artifact@v4
        with:
          name: MT_SW_APP-iOS
          path: build/MT_SW_APP-iOS.ipa
          if-no-files-found: error

# --- Android build features ---
android.defaults.buildfeatures.resvalues=false
android.defaults.buildfeatures.shaders=false
# Lint analysis runs in its own worker, so neither org.gradle.jvmargs nor
# kotlin.daemon.jvmargs applies to it. The default heap OOMs on a cold analysis.
android.experimental.lint.heapSize=3G

# --- Compose ---
android.experimental.enableScreenshotTest=true
compose.hot.reload=true
enableComposeCompilerMetrics=false
enableComposeCompilerReports=false

# --- Kotlin ---
kotlin.code.style=official
# Only kotlin.daemon.jvmargs is read from here; kotlin.daemon.jvm.options is a system
# property. Unset, the daemon inherits org.gradle.jvmargs' 8g and over-commits CI runners.
kotlin.daemon.jvmargs=-Xmx6g -XX\:+UseG1GC -XX\:SoftRefLRUPolicyMSPerMB=1 -XX\:ReservedCodeCacheSize=320m -XX\:+HeapDumpOnOutOfMemoryError
kotlin.daemon.useFallback=true
# The Kotlin/Native compiler runs in its own JVM, governed by neither of the heaps
# above. Its 3g default OOMs compiling every module for iOS from a cold cache.
kotlin.native.jvmArgs=-Xmx5g -XX\:+UseG1GC -XX\:+HeapDumpOnOutOfMemoryError
# Gradle-recommended safety net: don't fail the task graph when a Kotlin/Native target
# HostManager itself refuses to configure on this host. Note this did NOT fix the
# :core:ble:compileTestKotlinIosSimulatorArm64 xmlutil:0.91.3 resolution failure seen on
# Windows/Linux x64 dev machines -- that target isn't "disabled" by HostManager on x64 hosts
# (supportsKotlinNative() in build-logic registers it there), so this property never applies
# to it. The real fix for that failure is the `exclude(group = "io.github.pdvrieze.xmlutil")`
# on kotest-property in build-logic/convention/.../KotlinAndroid.kt's
# configureKmpTestDependencies(): kotest-property 6.2.5 transitively pulls xmlutil 0.91.3,
# which conflicts with this project's pinned 1.0.2.1 and has no iosSimulatorArm64/iosArm64
# variant. Kept here for the (different, genuine) case of a target HostManager disables.
kotlin.native.ignoreDisabledTargets=true

# xmlutil (gradle/libs.versions.toml) publishes no Apple-native (iOS/macOS) klib as of the pinned
# 1.0.2.1 -- confirmed via Gradle's "no matching variant" resolution failure when compiling for
# iosSimulatorArm64/iosArm64, and via Maven Central never publishing a
# core-iossimulatorarm64/core-iosarm64 xmlutil artifact past 0.91.1. core:model (needed from
# commonMain by nearly every module in this repo) api()-exports the external takpacket-sdk
# artifact, which pulls xmlutil transitively for its own iOS variant; core:takserver depends on
# xmlutil directly. Since core:model sits near the root of the dependency graph, that missing
# variant fails iOS-target resolution for nearly the whole module graph, not just those two
# modules -- so this is a project-wide (not per-module) opt-out. See
# build-logic/convention/.../KotlinAndroid.kt's skipsIosNativeTargets() for how it's read. iOS
# targets are compile-only validation (never actually run) in this repo, so skipping their
# registration entirely is safe -- it just means one less thing validated on hosts where they'd
# otherwise register (Windows/macOS/Linux x86_64; CI's linux-aarch64 runners already never
# register them, which is why this was never caught there). Remove once xmlutil resumes
# publishing Apple-native klibs, or takpacket-sdk drops its xmlutil dependency for iOS.
meshtastic.skipIosNativeTargets=true

# --- KSP ---
# (incremental processing is default-on in KSP2; only the non-default flag is declared)
ksp.project.isolation.enabled=true

# --- Gradle ---
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.jvmargs=-Xmx8g -XX:+UseG1GC -XX:+ParallelRefProcEnabled -XX:+UseStringDeduplication -XX:ReservedCodeCacheSize=512m -XX:MaxMetaspaceSize=2g -Xss2m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8 -Djava.awt.headless=true -Dapple.awt.UIElement=true
org.gradle.parallel=true
# Run the daemon and its workers at low OS priority so full builds don't starve
# the foreground UI on developer laptops. Negligible on dedicated CI runners.
org.gradle.priority=low
# Studio passes -Dorg.gradle.tooling.parallel.ignore-legacy-default=true on every sync,
# which strips org.gradle.parallel's implication for Tooling API model building — so IDE
# sync needs this explicit opt-in. Inert while org.gradle.isolated-projects=true (that
# path parallelises model building on its own) and never read by a CI build; kept so sync
# stays parallel if Isolated Projects is ever off.
org.gradle.tooling.parallel=true
org.gradle.welcome=never

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true

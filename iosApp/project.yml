# Plik dla XcodeGen: z niego powstaje projekt Xcode (MTSWApp.xcodeproj). Sam projekt nie jest w repo.
# XcodeGen input: generates the Xcode project (MTSWApp.xcodeproj). The generated project is not kept in the repo.
name: MTSWApp
options:
  bundleIdPrefix: pl.sw
  deploymentTarget:
    iOS: "17.5"
  createIntermediateGroups: true
  defaultConfig: Release
# Tylko Release: nie ma konfiguracji Debug (szybka aplikacja; Debug Compose jest bardzo wolny).
# Release only: there is no Debug configuration (a fast app; Debug Compose is very slow).
configs:
  Release: release
configFiles:
  Release: Signing.xcconfig
# Ustawienia polecane przez Xcode (okienko „Update to recommended settings” już się nie pokazuje).
# Settings recommended by Xcode (so its "Update to recommended settings" prompt no longer appears).
settings:
  base:
    CLANG_ANALYZER_LOCALIZABILITY_NONLOCALIZED: YES
    STRING_CATALOG_GENERATE_SYMBOLS: YES
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
schemes:
  MTSWApp:
    build:
      targets:
        MTSWApp: all
        MTSWWidget: all
    run:
      config: Release
    test:
      config: Release
    profile:
      config: Release
    analyze:
      config: Release
    archive:
      config: Release
targets:
  MTSWApp:
    type: application
    platform: iOS
    sources:
      - path: MTSWApp
      # The bundled JSON assets (firmware releases, device list ...), the same files the Android app reads.
      - path: ../androidApp/src/main/assets
        includes:
          - "*.json"
        buildPhase: resources
    info:
      path: MTSWApp/Info.plist
      properties:
        CFBundleDisplayName: MT_SW_APP
        CFBundleLocalizations:
          - en
          - pl
          - ar
          - sr-Latn
          - be
          - bg
          - ca
          - cs
          - de
          - el
          - es
          - et
          - fi
          - fr
          - fr-CA
          - ga
          - gl
          - he
          - hr
          - ht
          - hu
          - is
          - it
          - ja
          - ko
          - lt
          - nb
          - nl
          - pt
          - pt-BR
          - ro
          - ru
          - sk
          - sl
          - sq
          - sr
          - sv
          - tr
          - uk
          - zh-Hans
          - zh-Hant
        UILaunchScreen: {}
        CADisableMinimumFrameDurationOnPhone: true
        MTSWAppStoreBuild: $(MTSW_APP_STORE_BUILD)
        ITSAppUsesNonExemptEncryption: false
        NSLocalNetworkUsageDescription: "MT_SW łączy się z radiem LoRa (mesh) przez Wi-Fi w sieci lokalnej."
        NSBonjourServices:
          - _meshtastic._tcp
        UIBackgroundModes:
          - bluetooth-central
          - location
          - audio
        NSBluetoothAlwaysUsageDescription: "MT_SW łączy się przez Bluetooth z radiem LoRa (mesh)."
        NSMicrophoneUsageDescription: "MT_SW używa mikrofonu do dyktowania wiadomości."
        NSLocationAlwaysAndWhenInUseUsageDescription: "MT_SW pokazuje Twoją pozycję na mapie i w kompasie, może ją wysłać do sieci mesh, a po włączeniu „Praca w tle” utrzymuje połączenie z radiem i zbieranie danych, gdy aplikacja nie jest na wierzchu."
        NSLocationWhenInUseUsageDescription: "MT_SW pokazuje Twoją pozycję na mapie, w kompasie i może ją wysłać do sieci mesh."
        NSMotionUsageDescription: "MT_SW odczytuje ciśnienie powietrza (barometr) i położenie telefonu w widoku terenu."
        NSCameraUsageDescription: "MT_SW używa aparatu do skanowania kodów QR (kanały, kontakty, kod połączenia) oraz do widoku terenu (panoramy) z nałożonymi węzłami mesh."
        NSHealthShareUsageDescription: "MT_SW odczytuje z aplikacji Zdrowie kroki, dystans, tętno i energię z czasu wędrówki, aby pokazać je w jej szczegółach."
        NSHealthUpdateUsageDescription: "MT_SW zapisuje w aplikacji Zdrowie zakończoną wędrówkę jako trening wraz z trasą, tylko gdy o to poprosisz."
        NSPhotoLibraryAddUsageDescription: "MT_SW zapisuje w Zdjęciach obraz z aparatu z nałożonymi węzłami mesh (widok terenu)."
        CFBundleURLTypes:
          - CFBundleURLName: "MT_SW link"
            CFBundleURLSchemes:
              - meshtastic
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    dependencies:
      - framework: ../native/ios/llama.xcframework
        embed: true
        codeSign: true
      - target: MTSWWidget
        embed: true
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: "AppIcon-Standard AppIcon-StandardFlat AppIcon-Dark AppIcon-DarkFlat AppIcon-Clear AppIcon-Tinted"
        PRODUCT_BUNDLE_IDENTIFIER: pl.sw.mt
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        FRAMEWORK_SEARCH_PATHS: "$(SRCROOT)/../iosShared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
        OTHER_LDFLAGS: "$(inherited) -lsqlite3"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: MTSWApp/MTSWApp.entitlements
        MTSW_APP_STORE_BUILD: NO
        "ARCHS[sdk=iphonesimulator*]": arm64
    preBuildScripts:
      - name: Kotlin framework (Gradle)
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/.."
          # Symulator Apple Silicon ma tylko arm64 (bez Intela).
          case "$SDK_NAME" in iphonesimulator*) export ARCHS=arm64 ;; esac
          # MTSW_GRADLE_ARGS: dodatkowe ustawienia (np. więcej pamięci dla kompilatora) przekazywane przez scripts/build-ios-ipa.sh.
          # Gdy ich nie ma (zwykłe Uruchom w Xcode), kompilator iOS dostaje tyle samo pamięci co w skrypcie .ipa (Release jej potrzebuje), a kompilacja ma zwykły priorytet (w gradle.properties jest „niski”, co zwalnia budowanie z Xcode).
          # Tymczasowo: raport czasów budowy trafia do build/reports/profile (do ustalenia, co spowalnia budowę iPhone'a).
          ./gradlew :iosShared:embedAndSignAppleFrameworkForXcode ${MTSW_GRADLE_ARGS:--Dorg.gradle.jvmargs=-Xmx12g -Pkotlin.native.jvmArgs=-Xmx12g -Dorg.gradle.priority=normal --profile -Pkotlin.build.report.output=file}
  MTSWWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: MTSWWidget
        excludes:
          - "*.entitlements"
    info:
      path: MTSWWidget/Info.plist
      properties:
        CFBundleDisplayName: Statystyki MT_SW
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: pl.sw.mt.widget
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: MTSWWidget/MTSWWidget.entitlements
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES

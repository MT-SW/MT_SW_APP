# Plik dla XcodeGen: z niego powstaje projekt Xcode (MTSWApp.xcodeproj). Sam projekt nie jest w repo.
# XcodeGen input: generates the Xcode project (MTSWApp.xcodeproj). The generated project is not kept in the repo.
name: MTSWApp
options:
  bundleIdPrefix: pl.mtsw
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
targets:
  MTSWApp:
    type: application
    platform: iOS
    sources:
      - path: MTSWApp
    info:
      path: MTSWApp/Info.plist
      properties:
        CFBundleDisplayName: MT_SW_APP
        UILaunchScreen: {}
        CADisableMinimumFrameDurationOnPhone: true
        MTSWAppStoreBuild: $(MTSW_APP_STORE_BUILD)
        ITSAppUsesNonExemptEncryption: false
        NSLocalNetworkUsageDescription: "MT_SW łączy się z radiem LoRa (mesh) przez Wi-Fi w sieci lokalnej."
        NSBonjourServices:
          - _meshtastic._tcp
        UIBackgroundModes:
          - bluetooth-central
          - location
        NSBluetoothAlwaysUsageDescription: "MT_SW łączy się przez Bluetooth z radiem LoRa (mesh)."
        NSMicrophoneUsageDescription: "MT_SW używa mikrofonu do dyktowania wiadomości."
        NSLocationAlwaysAndWhenInUseUsageDescription: "MT_SW pokazuje Twoją pozycję na mapie i w kompasie, może ją wysłać do sieci mesh, a po włączeniu „Praca w tle” utrzymuje połączenie z radiem i zbieranie danych, gdy aplikacja nie jest na wierzchu."
        NSLocationWhenInUseUsageDescription: "MT_SW pokazuje Twoją pozycję na mapie, w kompasie i może ją wysłać do sieci mesh."
        NSMotionUsageDescription: "MT_SW odczytuje ciśnienie powietrza (barometr) i położenie telefonu w widoku terenu."
        NSCameraUsageDescription: "MT_SW pokazuje obraz z aparatu w widoku terenu (panoramie), z nałożonymi węzłami mesh."
        CFBundleURLTypes:
          - CFBundleURLName: "MT_SW link"
            CFBundleURLSchemes:
              - meshtastic
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    dependencies:
      - framework: ../native/ios/llama.xcframework
        embed: true
        codeSign: true
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: pl.mtsw.mtswapp
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        FRAMEWORK_SEARCH_PATHS: "$(SRCROOT)/../iosShared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
        OTHER_LDFLAGS: "$(inherited) -lsqlite3"
        CODE_SIGN_STYLE: Automatic
        MTSW_APP_STORE_BUILD: NO
        "ARCHS[sdk=iphonesimulator*]": arm64
    preBuildScripts:
      - name: Kotlin framework (Gradle)
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/.."
          # Symulator Apple Silicon ma tylko arm64 (bez Intela).
          case "$SDK_NAME" in iphonesimulator*) export ARCHS=arm64 ;; esac
          # MTSW_GRADLE_ARGS: dodatkowe ustawienia (np. więcej pamięci dla kompilatora) przekazywane przez scripts/build-ios-ipa.sh
          ./gradlew :iosShared:embedAndSignAppleFrameworkForXcode $MTSW_GRADLE_ARGS

# Plik dla XcodeGen: z niego powstaje projekt Xcode (MTSWApp.xcodeproj). Sam projekt nie jest w repo.
# XcodeGen input: generates the Xcode project (MTSWApp.xcodeproj). The generated project is not kept in the repo.
name: MTSWApp
options:
  bundleIdPrefix: pl.mtsw
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
targets:
  MTSWApp:
    type: application
    platform: iOS
    sources:
      - path: MTSWApp
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: MTSWApp/Info.plist
      properties:
        CFBundleDisplayName: MT_SW
        UILaunchScreen: {}
        CADisableMinimumFrameDurationOnPhone: true
        NSLocalNetworkUsageDescription: "MT_SW łączy się z radiem LoRa (mesh) przez Wi-Fi w sieci lokalnej."
        NSBonjourServices:
          - _meshtastic._tcp
        UIBackgroundModes:
          - bluetooth-central
        NSBluetoothAlwaysUsageDescription: "MT_SW łączy się przez Bluetooth z radiem LoRa (mesh)."
        NSMicrophoneUsageDescription: "MT_SW używa mikrofonu do dyktowania wiadomości."
        NSLocationWhenInUseUsageDescription: "MT_SW pokazuje Twoją pozycję na mapie, w kompasie i może ją wysłać do sieci mesh."
        NSMotionUsageDescription: "MT_SW odczytuje ciśnienie powietrza (barometr) telefonu."
        CFBundleURLTypes:
          - CFBundleURLName: "MT_SW link"
            CFBundleURLSchemes:
              - meshtastic
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    dependencies:
      - framework: ../native/ios/llama.xcframework
        embed: true
        codeSign: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: pl.mtsw.mtswapp
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        FRAMEWORK_SEARCH_PATHS: "$(SRCROOT)/../iosShared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
        OTHER_LDFLAGS: "$(inherited) -lsqlite3"
        CODE_SIGN_STYLE: Automatic
        "ARCHS[sdk=iphonesimulator*]": arm64
    preBuildScripts:
      - name: Kotlin framework (Gradle)
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/.."
          # Symulator Apple Silicon ma tylko arm64 (bez Intela).
          case "$SDK_NAME" in iphonesimulator*) export ARCHS=arm64 ;; esac
          ./gradlew :iosShared:embedAndSignAppleFrameworkForXcode
